name: luna-terra-demo
services:
  demo:
    build: .
    restart: unless-stopped
    init: true
    # Linux host networking preserves the real peer for trusted-proxy checks.
    network_mode: host
    environment:
      DEMO_HOST: '${DEMO_BIND_HOST:-127.0.0.1}'
      DEMO_PORT: '${DEMO_PORT:-4200}'
      DEMO_RATE_STORE: redis
      REDIS_URL: 'redis://127.0.0.1:${DEMO_REDIS_PORT:-6387}'
      DEMO_RATE_LIMIT: '${DEMO_RATE_LIMIT:-10}'
      DEMO_RATE_WINDOW_MS: '${DEMO_RATE_WINDOW_MS:-600000}'
      DEMO_TRUST_PROXY: '${DEMO_TRUST_PROXY:-}'
      DEMO_RENDER_WORKERS: '${DEMO_RENDER_WORKERS:-2}'
      DEMO_RENDER_QUEUE: '${DEMO_RENDER_QUEUE:-16}'
      DEMO_RENDER_TIMEOUT_MS: '${DEMO_RENDER_TIMEOUT_MS:-10000}'
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    stop_grace_period: 20s
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --appendfsync, always, --maxmemory, 64mb, --maxmemory-policy, noeviction]
    ports:
      - '127.0.0.1:${DEMO_REDIS_PORT:-6387}:6379'
    volumes:
      - render-limits:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    cpus: 0.5
volumes:
  render-limits:
